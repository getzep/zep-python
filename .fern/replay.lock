      From 0a8e75cac06010f33e9a3ac27518605f812dea26 Mon Sep 17 00:00:00 2001
      From: paulpaliychuk <pavlo.paliychuk.ca@gmail.com>
      Date: Mon, 24 Aug 2026 18:54:36 -0400
      Subject: [PATCH] Port the hand-written wrappers to the v4 surface

      The .fernignore-protected files still targeted v3, so every v4 generation
      failed mypy no matter how good the contract was.

      external_clients/graph.py: v4 generates graph.set_ontology, so the
      hand-written override of that name collided with it. The Pydantic ontology
      DSL is unchanged and now feeds the generated call through build_ontology,
      which is exported so the project scope can send the same payload to
      project.set_ontology. user_ids and graph_ids are gone: they drove a
      server-side fan-out v4 has no endpoint for (spec-3 14.4), so the graph is an
      explicit argument and a caller targeting several graphs calls once per graph.
      EntityEdgeSourceTarget is EdgeSourceTarget, whose fields v4 spells
      source_entity_type and target_entity_type.

      client.py: the v4 generator exposes sub-clients as read-only properties, so
      the external user and graph clients are held privately and surfaced by
      overriding the property rather than assigning over it. The legacy /api/v2
      base-URL handling is dropped for /api/v4 (14.4).

      graph/utils.py: EntityEdge and EntityNode are Edge and Node, created_at is
      optional on the v4 model, and v4 resolves v3's overloaded role plus role_type
      into role, the enum, and role_name, the sender. The composed string is
      unchanged, and tests/graph/test_utils.py follows, including its duck-typed
      mocks.

      Verified against the generated client from the 4.0.0-alpha.1 candidate: mypy
      reports no issues across 168 files and the 16 context-string tests pass.

      This branch does not typecheck on its own until the next generation lands,
      since the wrappers now expect v4 types while the checked-in generated code is
      still v3. Nothing builds the base branch by itself; CI builds the generation
      pull request, which is this plus the v4 client.
